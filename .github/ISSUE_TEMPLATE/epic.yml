name: Epic
description: Large outcome that spans multiple stories. Creates a trackable unit of work.
title: "[Epic] "
labels: ["epic"]
projects: ["dinoesau/5"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome does this epic deliver? One or two sentences.
      placeholder: "As a user, I want to try comparison without uploading photos, so I can understand the product quickly."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope? What is explicitly out of scope?
      placeholder: |
        In:
        - "Load demo" button loads 2 sample images into slots A and B
        Out:
        - No persistence, no new compare logic
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know the epic is done?
      placeholder: |
        - [ ] Demo loads 2 images ready for Compare
        - [ ] Loading and error states handled
        - [ ] Covered by sub-issues below
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: Stories
      description: Link sub-issues here after creating them (GitHub Sub-issues or #numbers). Do not hand-number stories.
      placeholder: |
        - #<story-issue-number>
    validations:
      required: false
