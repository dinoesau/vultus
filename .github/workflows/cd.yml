name: cd

# CD estricto por tags: solo v*.*.* despliega a prod (edge + humo + GPU + humo + release).
# Sin preview: push a production no despliega nada, solo deja el codigo listo.
# main es integracion (CI). Orden: merge a production, tag en la punta, push tag.
# Tags deben salir de production (guard lo verifica). Manual no despliega prod.

on:
  push:
    branches: [production]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      run_modal:
        description: 'Solo debug, no despliega prod. Prod solo via tag.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-edge:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: guard tag sobre production
        run: |
          git fetch origin production
          TAG_SHA="${{ github.sha }}"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/production; then
            echo "::error::tag ${{ github.ref_name }} no sale de production. Haz: git checkout production && git tag ${{ github.ref_name }} && git push origin production ${{ github.ref_name }}"
            exit 1
          fi
          echo "release ${{ github.ref_name }} desde $TAG_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ensure queues and r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUEUE_NAME: vultus-jobs
          R2_BUCKET: vultus-jobs
          LIFECYCLE_RULE: expire-jobs
        run: |
          if npx --yes wrangler@4 queues list 2>/dev/null | grep -q "$QUEUE_NAME"; then
            echo "queue $QUEUE_NAME ya existe, se omite"
          else
            npx --yes wrangler@4 queues create "$QUEUE_NAME"
          fi
          if npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -q "$R2_BUCKET"; then
            echo "bucket $R2_BUCKET ya existe, se omite"
          else
            npx --yes wrangler@4 r2 bucket create "$R2_BUCKET"
          fi
          if npx --yes wrangler@4 r2 bucket lifecycle list "$R2_BUCKET" 2>/dev/null | grep -q "$LIFECYCLE_RULE"; then
            echo "lifecycle $LIFECYCLE_RULE ya existe, se omite"
          else
            npx --yes wrangler@4 r2 bucket lifecycle add "$R2_BUCKET" "$LIFECYCLE_RULE" 'jobs/' --expire-days 1 -y
          fi
      - name: deploy worker production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --env production
      - name: build frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          VITE_API_URL=https://api.vultus.esau.com.mx npm run build
      - name: upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
      - name: deploy pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy frontend/dist --project-name vultus --commit-hash '${{ github.sha }}'

  smoke-edge:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy-edge
    steps:
      - uses: actions/checkout@v4
      - name: smoke prod gateway
        env:
          API_URL: https://api.vultus.esau.com.mx
        run: bash scripts/smoke-prod.sh

  deploy-modal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smoke-edge
    # En push inputs no existe y '' != false es falso: sin este OR Modal
    # nunca desplegaria en release. Manual nunca es tag, asi que solo corre en push de tag.
    if: startsWith(github.ref, 'refs/tags/v') && needs.smoke-edge.result == 'success' && (github.event_name == 'push' || inputs.run_modal != false)
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install modal cli
        run: pip install 'modal==1.5.5'
      - name: deploy modal workers
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy backend/modal_app.py

  smoke-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke-edge, deploy-modal]
    if: always() && needs.smoke-edge.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: smoke prod after modal
        env:
          API_URL: https://api.vultus.esau.com.mx
        run: bash scripts/smoke-prod.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-modal, smoke-e2e]
    permissions:
      contents: write
    steps:
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG ya existe, se omite"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
