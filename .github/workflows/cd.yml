name: cd

# CD estricto por tags: solo v*.*.* despliega a prod (edge + humo + GPU + humo + release).
# Sin preview: push a production no despliega nada, solo deja el codigo listo.
# main es integracion (CI). Orden: merge a production, crear tag (boton bump o git tag), push tag.
# Tags deben salir de production (guard lo verifica). El CD crea el Release, el humano solo pone el numero.

on:
  push:
    branches: [production]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump major, minor o patch (crea el tag solo, el CD hace el release)'
        required: false
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
      version:
        description: 'Override version exacta sin v (opcional, ej 0.2.0)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production
      - name: crear tag desde bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          git fetch origin production --tags
          git checkout production
          OVERRIDE="$(echo "${VERSION_OVERRIDE:-}" | tr -d ' ' | sed 's/^v//')"
          if [ -n "$OVERRIDE" ]; then
            if ! echo "$OVERRIDE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version invalida: $OVERRIDE (usa X.Y.Z)"
              exit 1
            fi
            NEXT="$OVERRIDE"
          else
            LATEST="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo 'v0.1.0')"
            BASE="${LATEST#v}"
            MAJOR="$(echo "$BASE" | cut -d. -f1)"
            MINOR="$(echo "$BASE" | cut -d. -f2)"
            PATCH="$(echo "$BASE" | cut -d. -f3)"
            case "${BUMP:-patch}" in
              major) NEXT="$((MAJOR + 1)).0.0" ;;
              minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
              *) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
          fi
          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "::error::tag v$NEXT ya existe"
            exit 1
          fi
          git tag "v$NEXT"
          git push origin "v$NEXT"
          echo "tag v$NEXT creado sobre production, el CD de tag despliega solo"

  deploy-edge:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: guard tag sobre production
        run: |
          git fetch origin production
          TAG_SHA="${{ github.sha }}"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/production; then
            echo "::error::tag ${{ github.ref_name }} no sale de production. Haz: git checkout production && git tag ${{ github.ref_name }} && git push origin production ${{ github.ref_name }}"
            exit 1
          fi
          echo "release ${{ github.ref_name }} desde $TAG_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ensure queues and r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUEUE_NAME: vultus-jobs
          R2_BUCKET: vultus-jobs
          LIFECYCLE_RULE: expire-jobs
        run: |
          if npx --yes wrangler@4 queues list 2>/dev/null | grep -q "$QUEUE_NAME"; then
            echo "queue $QUEUE_NAME ya existe, se omite"
          else
            npx --yes wrangler@4 queues create "$QUEUE_NAME"
          fi
          if npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -q "$R2_BUCKET"; then
            echo "bucket $R2_BUCKET ya existe, se omite"
          else
            npx --yes wrangler@4 r2 bucket create "$R2_BUCKET"
          fi
          if npx --yes wrangler@4 r2 bucket lifecycle list "$R2_BUCKET" 2>/dev/null | grep -q "$LIFECYCLE_RULE"; then
            echo "lifecycle $LIFECYCLE_RULE ya existe, se omite"
          else
            npx --yes wrangler@4 r2 bucket lifecycle add "$R2_BUCKET" "$LIFECYCLE_RULE" 'jobs/' --expire-days 1 -y
          fi
      - name: deploy worker production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --env production
      - name: build frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          VITE_API_URL=https://api.vultus.esau.com.mx npm run build
      - name: upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
      - name: deploy pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy frontend/dist --project-name vultus --commit-hash '${{ github.sha }}'

  smoke-edge:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy-edge
    steps:
      - uses: actions/checkout@v4
      - name: smoke prod gateway
        env:
          API_URL: https://api.vultus.esau.com.mx
        run: bash scripts/smoke-prod.sh

  deploy-modal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smoke-edge
    # Solo corre en push de tag: el numero lo pone el boton bump o git tag manual.
    if: startsWith(github.ref, 'refs/tags/v') && needs.smoke-edge.result == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install modal cli
        run: pip install 'modal==1.5.5'
      - name: deploy modal workers
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy backend/modal_app.py

  smoke-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke-edge, deploy-modal]
    if: always() && needs.smoke-edge.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: smoke prod after modal
        env:
          API_URL: https://api.vultus.esau.com.mx
        run: bash scripts/smoke-prod.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-modal, smoke-e2e]
    permissions:
      contents: write
    steps:
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG ya existe, se omite"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
