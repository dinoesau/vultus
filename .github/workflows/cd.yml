name: cd

# CD automatico: push a production despliega directo a prod (edge + humo + GPU + humo).
# Sin preview, sin tag manual. main es integracion (CI).
# Orden: merge a production, push rama, CD hace el resto y sube frontend-dist como artifact.

on:
  push:
    branches: [production]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      run_modal:
        description: 'Deploy Modal GPU workers'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ensure queues and r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUEUE_NAME: vultus-jobs
          R2_BUCKET: vultus-jobs
          LIFECYCLE_RULE: expire-jobs
        run: |
          if npx --yes wrangler@4 queues list 2>/dev/null | grep -q "$QUEUE_NAME"; then
            echo "queue $QUEUE_NAME ya existe, se omite"
          else
            npx --yes wrangler@4 queues create "$QUEUE_NAME"
          fi
          if npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -q "$R2_BUCKET"; then
            echo "bucket $R2_BUCKET ya existe, se omite"
          else
            npx --yes wrangler@4 r2 bucket create "$R2_BUCKET"
          fi
          if npx --yes wrangler@4 r2 bucket lifecycle list "$R2_BUCKET" 2>/dev/null | grep -q "$LIFECYCLE_RULE"; then
            echo "lifecycle $LIFECYCLE_RULE ya existe, se omite"
          else
            npx --yes wrangler@4 r2 bucket lifecycle add "$R2_BUCKET" "$LIFECYCLE_RULE" 'jobs/' --expire-days 1 -y
          fi
      - name: deploy worker production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --env production
      - name: build frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          VITE_API_URL=https://api.vultus.esau.com.mx npm run build
      - name: upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
      - name: deploy pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy frontend/dist --project-name vultus --commit-hash '${{ github.sha }}'

  smoke-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy-edge
    steps:
      - uses: actions/checkout@v4
      - name: smoke prod gateway
        env:
          API_URL: https://api.vultus.esau.com.mx
        run: bash scripts/smoke-prod.sh

  deploy-modal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smoke-edge
    # En push inputs no existe y '' != false es falso: sin este OR Modal
    # nunca desplegaria en push. Manual sigue con run_modal=false para saltarlo.
    if: needs.smoke-edge.result == 'success' && (github.event_name == 'push' || inputs.run_modal != false)
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install modal cli
        run: pip install 'modal==1.5.5'
      - name: deploy modal workers
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy backend/modal_app.py

  smoke-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke-edge, deploy-modal]
    if: always() && needs.smoke-edge.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: smoke prod after modal
        env:
          API_URL: https://api.vultus.esau.com.mx
        run: bash scripts/smoke-prod.sh
