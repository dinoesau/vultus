name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - working-directory: backend
        run: cargo fmt --check
      - working-directory: backend
        run: cargo clippy -- -D warnings
      - working-directory: backend
        run: cargo test

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f backend/Dockerfile ./backend
      - run: docker build -f backend/Dockerfile.gpu ./backend
      - run: docker build -f frontend/Dockerfile ./frontend

  e2e:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose up -d --build
      - run: |
          for i in $(seq 1 30); do
            curl -f http://localhost:8000/health && break
            sleep 2
          done
          curl -f http://localhost:8000/health | grep -q '"status":"ok"'
      - run: bash scripts/smoke-fase0.sh
        env:
          API_URL: http://localhost:8000
          FRONT_URL: http://localhost:4321
      - run: docker compose down
        if: always()

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx -y wrangler deploy --dry-run
