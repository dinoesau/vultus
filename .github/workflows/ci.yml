name: ci

# Fast-path automatico + slow-path manual via boton.
# Sin toolchain Rust: Python + TS + build + dry-run edge.
# El build GPU pesado nunca corre en automatico: solo con
# workflow_dispatch run_gpu=true (+ Approve si configuras el environment).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      run_cpu:
        description: 'Build CPU images (api + frontend)'
        type: boolean
        default: true
      run_gpu:
        description: 'Build GPU sidecar (lento, pide aprobacion)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-api.txt
      - name: python deps
        run: pip install -r backend/requirements-api.txt
      - name: python typecheck
        run: mypy --strict --explicit-package-bases --namespace-packages backend/domain.py backend/gnm.py backend/pipeline_local.py backend/local_runner.py
      - name: python lint
        run: ruff check backend/
      - name: python tests
        run: pytest backend/tests -q
      # S9 retiro la LUT BFM (`bfm_to_gnm_v2.bin` borrado): el gate de assets
      # via `compute_bfm_to_gnm.py --check` moria con `missing asset`.
      # El template GNM lo cubre `test_template_con_cuentas_canonicas`.

      - uses: actions/setup-node@v4
        with:
          # Astro 7 exige >=22.12 (frontend/Dockerfile ya usa node:22-slim).
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: edge contract tests
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx vitest run ../edge/contract.test.ts --root ..
      - name: gateway pool tests
        working-directory: frontend
        run: |
          npx vitest run --config vitest.pool.config.ts
      - name: frontend build
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build
      # Wrangler pineado a major 4: reproducible y cacheable por npx,
      # en vez de resolver `latest` en cada run.
      - name: edge dry-run
        run: npx --yes wrangler@4 deploy --dry-run
      # Lint de Dockerfiles sin construir ninguna imagen.
      # Solo errores bloquean: los warnings (ej. pin de versiones apt,
      # fragil ante snapshots de Debian) quedan como aviso.
      - name: dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: error

  docker-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast
    if: github.event_name == 'push' || inputs.run_cpu == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: ./backend/Dockerfile.wrangler
          - name: runner
            context: .
            dockerfile: ./backend/Dockerfile.runner
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Boton de aceptar: crea el environment `gpu` en Settings > Environments
    # y añade un required reviewer. Sin esa config corre directo al pulsar
    # Run workflow con run_gpu=true; con la config, espera tu Approve.
    environment: gpu
    needs: fast
    if: inputs.run_gpu == true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.gpu
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
