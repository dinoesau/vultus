name: ci

# Fast-path automatico <30s (cache caliente) + slow-path manual via boton.
# El build GPU pesado nunca corre en automatico: solo con
# workflow_dispatch run_gpu=true (+ Approve si configuras el environment).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      run_cpu:
        description: 'Build CPU images (api + frontend)'
        type: boolean
        default: true
      run_gpu:
        description: 'Build GPU sidecar (lento, pide aprobacion)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: vultus-fast
      # Falla en ~2s sin compilar si el formato esta roto.
      - name: fmt
        working-directory: backend
        run: cargo fmt --check
      - name: clippy
        working-directory: backend
        run: cargo clippy --locked -- -D warnings
      - name: test
        working-directory: backend
        run: cargo test --locked

      - uses: actions/setup-node@v4
        with:
          # Astro 7 exige >=22.12 (frontend/Dockerfile ya usa node:22-slim).
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend build
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build
      # Wrangler pineado a major 4: reproducible y cacheable por npx,
      # en vez de resolver `latest` en cada run.
      - name: edge dry-run
        run: npx --yes wrangler@4 deploy --dry-run
      # Lint de Dockerfiles sin construir ninguna imagen.
      - name: dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

  docker-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast
    if: github.event_name == 'push' || inputs.run_cpu == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Boton de aceptar: crea el environment `gpu` en Settings > Environments
    # y añade un required reviewer. Sin esa config corre directo al pulsar
    # Run workflow con run_gpu=true; con la config, espera tu Approve.
    environment: gpu
    needs: fast
    if: inputs.run_gpu == true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.gpu
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
