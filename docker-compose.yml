services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.wrangler
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      R2_TTL_SECONDS: "60"
      RUNNER_WEBHOOK_URL: "http://runner:8001/hooks/queue"
    depends_on:
      runner:
        condition: service_started
      ml-sidecar:
        condition: service_started
    volumes:
      - wrangler-state:/work/.wrangler
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Consumidor local: recibe el mensaje dev de la queue del worker via
  # webhook, corre el pipeline contra el sidecar y reporta por HTTP.
  # Mismo patron que los workers GPU en prod (HTTP Pull Consumer).
  runner:
    build:
      context: .
      dockerfile: backend/Dockerfile.runner
    ports:
      - "8001:8001"
    environment:
      RUNNER_HOST: "0.0.0.0"
      RUNNER_PORT: "8001"
      GATEWAY_URL: "http://api:8000"
      ML_SIDECAR_URL: "http://ml-sidecar:8081"
    depends_on:
      ml-sidecar:
        condition: service_started
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Sidecar ML: MediaPipe / FLAME / FreeUV tras POST /ml/*.
  # En prod estos modelos corren en Modal (`modal deploy backend/modal_app.py`).
  # GPU local: descomenta el bloque `deploy` de ml-sidecar y corre
  # `docker compose up --build -d` con un solo comando.
  ml-sidecar:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    ports:
      - "8081:8081"
    environment:
      ML_PORT: "8081"
    tmpfs:
      - /tmp
    # Probe real: /docs responde 200 en FastAPI (verificado). /ml/landmarks
    # con body vacio da 400, tambien sano; /docs es mas barato y estable.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/docs"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    # GPU con un solo comando (T4): descomentar para `docker compose up`.
    # Comentado por defecto para que el arranque CPU local siga verde sin
    # runtime nvidia. FreeUV concurrency=1 por GPU vive en modal_app.py.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
    environment:
      VITE_API_URL: "http://localhost:8000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  wrangler-state:
