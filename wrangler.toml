name = "vultus-api"
# Gateway unico TS: Worker fino (validar + R2 PutObject +
# enqueue {job_id, r2_keys}). Mismo handler en prod y dev
# (dev envuelve prod en edge/worker.dev.ts). GPU en Modal
# via HTTP Pull Consumer (backend/modal_app.py).
main = "edge/worker.ts"
compatibility_date = "2026-09-03"
# workers.dev como fallback hasta hardening (Fase 4 apaga con `false`).
workers_dev = true

# Cloudflare Pages maneja el frontend Astro static; este Worker expone Seam 1
# POST /v1/compare, GET /v1/jobs/:id, POST /v1/jobs/:id/progress (Modal),
# WS /v1/jobs/:id/events (progreso vivo), GET /health. Sin fallbacks dummy en prod.
# pages_build_output_dir: el `pages deploy` usa el toml en vez de solo args CLI.
pages_build_output_dir = "frontend/dist"

[[queues.producers]]
queue = "vultus-jobs"
binding = "VULTUS_QUEUE"

# Sin [[queues.consumers]]: el consumo GPU es via HTTP Pull Consumer desde
# Modal (ver backend/modal_app.py), no via binding Worker. Declarar un
# consumer sin exportar queue() hace que `wrangler dev` descarte mensajes.

[[r2_buckets]]
binding = "VULTUS_BUCKET"
bucket_name = "vultus-jobs"
preview_bucket_name = "vultus-jobs-preview"
# Prod real: olvido logico 60s en ProgressDO/Python; R2 lifecycle `vultus-jobs-1d`
# (jobs/ expire 1 dia, minimo R2) es solo red de seguridad via CLI.

[[durable_objects.bindings]]
name = "VULTUS_PROGRESS"
class_name = "ProgressDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProgressDO"]

[vars]
QUEUE_DRIVER = "cloudflare"
R2_TTL_SECONDS = "60"
VULTUS_API_URL = "https://api.vultus.esau.com.mx"
ALLOW_DEV_ROUTES = "0"

# Preview por PR: mismo codigo, recursos aislados, sin dominio custom.
[env.preview]
[[env.preview.queues.producers]]
queue = "vultus-jobs-preview"
binding = "VULTUS_QUEUE"

[[env.preview.r2_buckets]]
binding = "VULTUS_BUCKET"
bucket_name = "vultus-jobs-preview"

[[env.preview.durable_objects.bindings]]
name = "VULTUS_PROGRESS"
class_name = "ProgressDO"

[env.preview.vars]
QUEUE_DRIVER = "cloudflare"
R2_TTL_SECONDS = "60"
VULTUS_API_URL = ""
ALLOW_DEV_ROUTES = "0"

# Produccion: recursos reales, dominio custom solo en `deploy --env production`.
[env.production]
[[env.production.queues.producers]]
queue = "vultus-jobs"
binding = "VULTUS_QUEUE"

[[env.production.r2_buckets]]
binding = "VULTUS_BUCKET"
bucket_name = "vultus-jobs"

[[env.production.durable_objects.bindings]]
name = "VULTUS_PROGRESS"
class_name = "ProgressDO"

[env.production.vars]
QUEUE_DRIVER = "cloudflare"
R2_TTL_SECONDS = "60"
VULTUS_API_URL = "https://api.vultus.esau.com.mx"
ALLOW_DEV_ROUTES = "0"

# Custom Domain: solo prod reclama el dominio (preview usa workers.dev).
[[env.production.routes]]
pattern = "api.vultus.esau.com.mx"
custom_domain = true
