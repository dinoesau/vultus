name = "vultus-api"
# Híbrido ADR-005: el Worker edge es gateway fino (validar + R2 PutObject +
# enqueue {job_id, r2_keys}). La API pesada vive en Rust Axum
# (backend/crates/api) y el ML GPU en Python Modal (backend/modal_app.py).
# main apunta al entry TS; se eliminó `python_workers`.
main = "edge/worker.ts"
compatibility_date = "2026-09-03"
# workers.dev como fallback hasta hardening (Fase 4 apaga con `false`).
workers_dev = true

# Cloudflare Pages maneja el frontend Astro static; este Worker expone Seam 1
# POST /v1/compare, GET /v1/jobs/:id, WS /v1/jobs/:id/events, GET /health

[[queues.producers]]
queue = "vultus-jobs"
binding = "VULTUS_QUEUE"

# Sin [[queues.consumers]]: el consumo GPU es via HTTP Pull Consumer desde
# Modal (ver backend/modal_app.py), no via binding Worker. Declarar un
# consumer sin exportar queue() hace que `wrangler dev` descarte mensajes.

[[r2_buckets]]
binding = "VULTUS_BUCKET"
bucket_name = "vultus-jobs"
preview_bucket_name = "vultus-jobs-preview"

[[durable_objects.bindings]]
name = "VULTUS_PROGRESS"
class_name = "ProgressDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProgressDO"]

[vars]
QUEUE_DRIVER = "cloudflare"
R2_TTL_SECONDS = "60"

# Custom Domain: Cloudflare crea el DNS + certificado solo en `deploy`.
[[routes]]
pattern = "api.vultus.esau.com.mx"
custom_domain = true
